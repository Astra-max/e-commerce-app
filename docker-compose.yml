version: "3.9"

services:
  client:
    build: .
    container_name: node-app
    ports:
      - "3000:3000"
    
    volumes:
      - .:/app       # Mounts local code for hot reload (optional)
      - /app/node_modules
    
    environment:
      NODE_ENV: development
    command: npm run dev

  server-api:
    build: .
    container_name: server-api
    ports:
      - "5500:5500"
    
    volumes:
      - .:/app       # Mounts local code for hot reload (optional)
      - /app/node_modules
    
    environment:
      NODE_ENV: development
    command: npm run dev

  postgres_db:
    image: postgres
    container_name: postgres
    ports:
      - "5500:5500"
    
    volumes:
      - .:/app       # Mounts local code for hot reload (optional)
      - /app/node_modules
    
    environment:
      